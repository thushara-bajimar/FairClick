<!doctype html><html lang="en"><head><meta charset="utf-8"><title>StreamPlus - Exit survey</title><link rel="stylesheet" href="../style.css"></head>
<body>
<header class="sp-header"><a class="logo" href="../index.html">Stream<span>Plus</span></a></header>
<main class="panel">
  <h1>Tell us why you're leaving</h1>
  <p>You must complete this survey before you can cancel your membership.</p>
  <form method="get" action="confirm.html">
    <fieldset style="border:0;padding:0">
      <legend>Why are you leaving StreamPlus?</legend>
      <label class="opt"><input type="radio" name="why" value="price" required> It's too expensive</label>
      <label class="opt"><input type="radio" name="why" value="content"> Not enough content I like</label>
      <label class="opt"><input type="radio" name="why" value="tech"> Technical problems</label>
      <label class="opt"><input type="radio" name="why" value="none"> Prefer not to say</label>
    </fieldset>
    <p><label>Anything else? <textarea name="comments" rows="2" style="width:100%"></textarea></label></p>
    <button class="btn btn-purple" type="submit">Continue</button>
  </form>
</main>
</body></html>
